<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHT Search</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">DHT Search</span>
    <span class="sub">基于 FTS5 全文检索</span>
    <span id="countBadge" class="count-badge">加载中…</span>
  </header>

  <main class="container">
    <section class="search-area">
      <div class="search-input-wrap">
        <input id="q" type="text" placeholder="输入关键词搜索" autocomplete="off" />
        <button id="clearBtn" class="clear-btn" type="button" aria-label="清空搜索" title="清空搜索" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="搜索建议" hidden></div>
      </div>
      <dht-sort-group id="sortGroup"></dht-sort-group>
      <div class="size-filter">
        <label for="sizeRange" class="sr-only">大小范围</label>
        <select id="sizeRange" aria-label="大小范围">
          <option value="all">全部</option>
          <option value="lt100mb">&lt;100MB</option>
          <option value="100mb-1gb">100MB-1GB</option>
          <option value="1gb-10gb">1GB-10GB</option>
          <option value="10gb-100gb">10GB-100GB</option>
          <option value="gt100gb">&gt;100GB</option>
        </select>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </section>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="settings-head">
        <h2 class="settings-title">设置</h2>
        <button class="settings-close" type="submit" value="close" aria-label="关闭" title="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </form>
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-item">
            <div class="settings-item-title">同步最新索引</div>
            <div class="settings-item-desc">按 last_rowid 仅补录源库新增行（增量，秒级）</div>
          </div>
          <div class="settings-item">
            <div class="settings-item-title">重建索引</div>
            <div class="settings-item-desc">源库被改/删后，手动重建本地索引。该操作耗时较长，请谨慎使用。</div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-item">
            <div class="settings-item-title">RPC 推送（aria2 / Motrix）</div>
            <div class="settings-item-desc">将磁力链接推送到本地下载器；下载器需开启 JSON-RPC 并允许跨域</div>
            <div class="rpc-config">
              <label class="rpc-field"><span>地址</span><input id="rpcUrl" type="text" placeholder="http://localhost:16800/jsonrpc" autocomplete="off" spellcheck="false" /></label>
              <label class="rpc-field"><span>密钥</span><input id="rpcSecret" type="text" placeholder="可选，留空表示无密钥" autocomplete="off" spellcheck="false" /></label>
            </div>
          </div>
        </div>
      </div>
      <div class="settings-actions">
        <button id="syncBtn" type="button" class="settings-action">同步索引</button>
        <button id="reindexBtn" type="button" class="settings-action settings-action--danger">重建索引</button>
      </div>
    </dialog>

    <dialog id="confirmDialog" class="confirm-dialog">
      <p id="confirmMsg" class="confirm-msg"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" type="button" class="confirm-btn confirm-cancel">取消</button>
        <button id="confirmOk" type="button" class="confirm-btn confirm-ok">确定</button>
      </div>
    </dialog>

    <section id="hotView" class="hot-view" hidden>
      <div class="hot-toolbar">
        <span class="hot-title">热门关键词</span>
        <label class="edit-switch" title="开启后可删除关键词 / 管理黑名单">
          <span class="edit-label">关键词编辑</span>
          <input type="checkbox" id="editToggle" />
          <span class="edit-track"><span class="edit-thumb"></span></span>
        </label>
      </div>
      <div class="hot-layout">
        <div id="hotWords" class="hot-words"></div>
        <aside id="blacklistPanel" class="blacklist-panel" hidden>
          <div class="bl-head">
            <h3 class="bl-title">黑名单</h3>
            <div class="bl-actions">
              <button id="blImportBtn" class="icon-btn" type="button" aria-label="导入黑名单" title="导入黑名单（.txt，每行一个词）">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </button>
              <button id="blExportBtn" class="icon-btn" type="button" aria-label="导出黑名单" title="导出黑名单为 .txt">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
              <input id="blImportFile" type="file" accept=".txt,text/plain" hidden />
            </div>
          </div>
          <input id="blacklistFilter" class="bl-filter" type="text" placeholder="过滤黑名单…" autocomplete="off" />
          <ul id="blacklistList" class="bl-list"></ul>
          <p id="blacklistEmpty" class="bl-empty">暂无黑名单词</p>
        </aside>
      </div>
    </section>

    <result-list id="results" hidden></result-list>

    <button id="refreshBtn" class="result-refresh" type="button" aria-label="刷新搜索结果" title="刷新搜索结果" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>

    <div id="pagerRow" class="pager-row" hidden>
      <span id="pagerInfo" class="pager-info"></span>
      <nav id="pager" class="pager" hidden></nav>
      <span class="page-jump">
        跳至 <input id="jumpPage" type="number" min="1" value="" /> 页
      </span>
      <label class="page-size">
        每页
        <select id="pageSize">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
        条
      </label>
    </div>
  </main>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">搜索中…</div>
      <button id="cancelSearchBtn" type="button" class="loading-cancel">取消搜索</button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
